<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f5f5f7" id="themeColor">
  <title>Заметки</title>

  <script>
    // Применяем тему до появления интерфейса, чтобы не было белой вспышки.
    try {
      const savedTheme = localStorage.getItem("notes-theme");
      document.documentElement.dataset.theme =
        savedTheme === "dark" ? "dark" : "light";
    } catch {
      document.documentElement.dataset.theme = "light";
    }
  </script>

  <style>
    :root {
      color-scheme: light;

      --page: #f5f5f7;
      --sidebar: #ececf0;
      --surface: #ffffff;
      --surface-soft: #f5f5f7;
      --search: #eaeaee;
      --hover: #e6e6eb;
      --border: #e7e7ec;

      --text: #242428;
      --text-soft: #494951;
      --muted: #898992;
      --placeholder: #b0b0b8;

      --accent: #f4c543;
      --accent-hover: #ecc03e;
      --accent-text: #352900;

      --shadow: 0 8px 25px #2727330a;
      --shadow-hover: 0 18px 38px #27273318;
      --focus: #ddb43f;

      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      font-synthesis: none;
      background: var(--page);
      color: var(--text);
    }

    :root[data-theme="dark"] {
      color-scheme: dark;

      --page: #111218;
      --sidebar: #191a22;
      --surface: #20212b;
      --surface-soft: #292a36;
      --search: #262731;
      --hover: #30313e;
      --border: #363743;

      --text: #f1f1f5;
      --text-soft: #d0d0d9;
      --muted: #a0a0af;
      --placeholder: #747582;

      --accent: #f4c543;
      --accent-hover: #ffd35d;
      --accent-text: #342800;

      --shadow: 0 8px 26px #00000024;
      --shadow-hover: 0 18px 42px #00000050;
      --focus: #f4c543;
    }

    * {
      box-sizing: border-box;
    }

    html {
      background: var(--page);
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: var(--page);
      color: var(--text);
    }

    button,
    input,
    textarea,
    select {
      font: inherit;
    }

    button {
      cursor: pointer;
    }

    button:disabled {
      cursor: default;
      opacity: .5;
    }

    [hidden] {
      display: none !important;
    }

    button:focus-visible,
    input:focus-visible,
    textarea:focus-visible,
    select:focus-visible {
      outline: 2px solid var(--focus);
      outline-offset: 2px;
    }

    body,
    .sidebar,
    .main,
    .editor-screen,
    .editor-topbar,
    .editor-bottom,
    .card,
    .icon-btn,
    .soft-btn,
    .nav-item,
    .popover,
    .search,
    .meta input,
    .meta select,
    .check-row input[type="text"],
    .attachment {
      transition:
        background-color .32s ease,
        color .32s ease,
        border-color .32s ease,
        box-shadow .32s ease;
    }

    .app {
      display: grid;
      grid-template-columns: 270px minmax(0, 1fr);
      min-height: 100vh;
    }

    .sidebar {
      position: sticky;
      top: 0;
      height: 100vh;
      padding: 24px 16px;
      background: var(--sidebar);
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      gap: 29px;
    }

    .sidebar-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      padding-left: 13px;
    }

    .brand,
    .mobile-brand {
      font-size: 25px;
      font-weight: 760;
      letter-spacing: -.9px;
      white-space: nowrap;
    }

    .brand span,
    .mobile-brand span {
      color: #e6af1f;
    }

    .side-label {
      margin: 0 14px 10px;
      color: var(--muted);
      font-size: 11px;
      font-weight: 750;
      letter-spacing: .09em;
      text-transform: uppercase;
    }

    .nav-item {
      width: 100%;
      padding: 11px 14px;
      border: 0;
      border-radius: 11px;
      background: transparent;
      text-align: left;
      color: var(--text-soft);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      transition:
        background-color .25s ease,
        color .25s ease,
        transform .25s ease;
    }

    .nav-item:hover {
      background: var(--hover);
      transform: translateX(3px);
    }

    .nav-item.active {
      background: var(--surface);
      color: var(--text);
      font-weight: 650;
      box-shadow: var(--shadow);
    }

    .nav-item .count {
      color: var(--muted);
      font-size: 13px;
    }

    .side-bottom {
      margin-top: auto;
    }

    .main {
      width: min(100%, 1120px);
      margin: 0 auto;
      padding: 27px 44px 70px;
      animation: content-in .38s ease both;
    }

    .topbar,
    .heading,
    .editor-topbar,
    .editor-actions {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    .topbar {
      margin-bottom: 38px;
    }

    .top-actions {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .mobile-brand,
    .mobile-only {
      display: none;
    }

    .icon-btn {
      width: 40px;
      height: 40px;
      flex: 0 0 40px;
      border: 1px solid var(--border);
      border-radius: 12px;
      background: var(--surface);
      color: var(--text-soft);
      font-size: 19px;
      display: grid;
      place-items: center;
      box-shadow: var(--shadow);
      transition:
        transform .22s ease,
        background-color .3s ease,
        color .3s ease,
        border-color .3s ease,
        box-shadow .3s ease;
    }

    .icon-btn:hover {
      transform: translateY(-2px) rotate(-5deg);
      background: var(--surface-soft);
      box-shadow: var(--shadow-hover);
    }

    .theme-toggle {
      font-size: 21px;
    }

    .primary-btn,
    .soft-btn {
      transition:
        transform .22s ease,
        background-color .26s ease,
        color .26s ease,
        box-shadow .26s ease;
    }

    .primary-btn {
      border: 0;
      border-radius: 12px;
      padding: 11px 18px;
      background: var(--accent);
      color: var(--accent-text);
      font-weight: 720;
      box-shadow: 0 5px 15px #dfaa3030;
    }

    .primary-btn:hover {
      transform: translateY(-2px);
      background: var(--accent-hover);
      box-shadow: 0 9px 19px #dfaa3045;
    }

    .primary-btn:active,
    .soft-btn:active,
    .icon-btn:active,
    .card:active {
      transform: scale(.97);
    }

    .heading h1 {
      margin: 0;
      font-size: clamp(32px, 5vw, 48px);
      letter-spacing: -2px;
      line-height: 1.1;
    }

    .subtitle {
      margin: 8px 0 0;
      color: var(--muted);
      font-size: 14px;
    }

    .search {
      width: 100%;
      height: 46px;
      margin: 26px 0 23px;
      padding: 0 17px;
      border: 1px solid transparent;
      border-radius: 12px;
      outline: none;
      background: var(--search);
      color: var(--text);
    }

    .search::placeholder {
      color: var(--muted);
    }

    .search:focus {
      border-color: var(--focus);
      background: var(--surface);
      box-shadow: 0 0 0 4px #f4c5431c;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(245px, 1fr));
      gap: 15px;
      align-items: start;
    }

    .card {
      min-width: 0;
      min-height: 165px;
      padding: 19px;
      border: 1px solid var(--border);
      border-radius: 17px;
      background: var(--surface);
      color: var(--text);
      text-align: left;
      box-shadow: var(--shadow);
      animation: card-in .42s ease both;
      transition:
        transform .23s ease,
        box-shadow .23s ease,
        background-color .32s ease,
        border-color .32s ease;
    }

    .card:hover {
      transform: translateY(-5px);
      box-shadow: var(--shadow-hover);
    }

    .card-title {
      display: flex;
      justify-content: space-between;
      gap: 10px;
      font-size: 16px;
      font-weight: 720;
      overflow-wrap: anywhere;
    }

    .card-preview {
      display: -webkit-box;
      -webkit-box-orient: vertical;
      -webkit-line-clamp: 3;
      overflow: hidden;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
      color: var(--muted);
      font-size: 14px;
      line-height: 1.5;
      margin: 13px 0 22px;
    }

    .card-footer {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 6px;
      color: var(--muted);
      font-size: 12px;
    }

    .badge {
      border-radius: 7px;
      padding: 4px 7px;
      background: #e6ad2020;
      color: #bc9018;
    }

    .empty {
      grid-column: 1 / -1;
      padding: 75px 20px;
      border: 1px dashed var(--border);
      border-radius: 17px;
      text-align: center;
      color: var(--muted);
      animation: content-in .4s ease both;
    }

    .empty strong {
      display: block;
      margin-bottom: 8px;
      color: var(--text-soft);
      font-size: 19px;
    }

    .popover-wrap {
      position: relative;
    }

    .popover {
      position: absolute;
      z-index: 80;
      top: calc(100% + 8px);
      right: 0;
      width: 220px;
      padding: 6px;
      border: 1px solid var(--border);
      border-radius: 13px;
      background: var(--surface);
      box-shadow: var(--shadow-hover);
      animation: pop-in .18s ease both;
    }

    .popover button {
      display: block;
      width: 100%;
      padding: 10px 11px;
      border: 0;
      border-radius: 8px;
      background: transparent;
      text-align: left;
      color: var(--text);
      font-size: 14px;
    }

    .popover button:hover {
      background: var(--surface-soft);
    }

    /* Редактор занимает весь экран страницы. */
    .editor-screen {
      position: fixed;
      z-index: 50;
      inset: 0;
      width: 100%;
      height: 100vh;
      height: 100dvh;
      background: var(--surface);
      display: flex;
      flex-direction: column;
      overflow: hidden;
      animation: editor-in .35s cubic-bezier(.2, .75, .2, 1) both;
    }

    .editor-screen.closing {
      animation: editor-out .25s ease both;
      pointer-events: none;
    }

    .editor-topbar {
      flex: 0 0 auto;
      min-height: 72px;
      padding: 12px clamp(20px, 4vw, 58px);
      border-bottom: 1px solid var(--border);
      background: var(--surface);
    }

    .editor-topbar-left,
    .editor-topbar-right {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .editor-app-name {
      margin-left: 8px;
      font-size: 15px;
      font-weight: 720;
    }

    .editor-status {
      color: var(--muted);
      font-size: 13px;
    }

    .soft-btn {
      border: 0;
      border-radius: 10px;
      padding: 10px 13px;
      background: var(--surface-soft);
      color: var(--text-soft);
    }

    .soft-btn:hover {
      transform: translateY(-2px);
      background: var(--hover);
    }

    .danger {
      color: #e86666;
    }

    .editor-content {
      flex: 1 1 auto;
      min-height: 0;
      width: 100%;
      overflow-y: auto;
      overscroll-behavior: contain;
    }

    .editor-inner {
      width: min(100%, 960px);
      min-height: 100%;
      margin: 0 auto;
      padding:
        clamp(28px, 5vw, 70px)
        clamp(22px, 5vw, 56px)
        75px;
      display: flex;
      flex-direction: column;
    }

    .editor-kicker {
      margin-bottom: 20px;
      color: var(--muted);
      font-size: 13px;
      font-weight: 650;
    }

    .title-input {
      display: block;
      width: 100%;
      padding: 0 0 20px;
      border: 0;
      outline: 0;
      color: var(--text);
      background: transparent;
      font-size: clamp(34px, 5vw, 54px);
      font-weight: 750;
      letter-spacing: -1.9px;
    }

    .title-input::placeholder,
    .text-input::placeholder {
      color: var(--placeholder);
    }

    .text-row {
      display: flex;
      align-items: flex-start;
      gap: 18px;
      flex: 1 0 auto;
    }

    .text-input {
      width: 100%;
      min-height: 30vh;
      flex: 1 1 auto;
      padding: 8px 0;
      resize: vertical;
      border: 0;
      outline: 0;
      background: transparent;
      color: var(--text-soft);
      font-size: 17px;
      line-height: 1.8;
    }

    .attach-plus {
      flex: 0 0 43px;
      width: 43px;
      height: 43px;
      border: 0;
      border-radius: 50%;
      background: var(--accent);
      color: var(--accent-text);
      font-size: 29px;
      line-height: 1;
      box-shadow: 0 4px 13px #dfaa3035;
      transition: transform .24s ease, background-color .24s ease;
    }

    .attach-plus:hover {
      transform: rotate(90deg) scale(1.06);
      background: var(--accent-hover);
    }

    .attach-menu {
      width: 190px;
    }

    .section-label {
      margin: 22px 0 12px;
      color: var(--muted);
      font-size: 12px;
      font-weight: 700;
      text-transform: uppercase;
    }

    .checks {
      display: grid;
      gap: 8px;
    }

    .check-row {
      display: flex;
      align-items: center;
      gap: 9px;
    }

    .check-row input[type="text"] {
      flex: 1;
      min-width: 0;
      padding: 10px;
      border: 1px solid var(--border);
      border-radius: 9px;
      background: var(--surface);
      color: var(--text);
    }

    .check-row input[type="checkbox"] {
      accent-color: #e3ae23;
      width: 18px;
      height: 18px;
    }

    .attachments {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
    }

    .attachment {
      position: relative;
      width: 128px;
      min-height: 95px;
      border-radius: 11px;
      background: var(--surface-soft);
      overflow: hidden;
    }

    .attachment img {
      width: 128px;
      height: 95px;
      object-fit: cover;
      display: block;
    }

    .attachment a {
      display: block;
      padding: 15px 10px;
      color: var(--text-soft);
      font-size: 12px;
      overflow-wrap: anywhere;
    }

    .remove-attachment {
      position: absolute;
      top: 5px;
      right: 5px;
      width: 24px;
      height: 24px;
      border: 0;
      border-radius: 50%;
      background: #26262bd9;
      color: #fff;
      line-height: 1;
    }

    .meta {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 17px;
      margin-top: 35px;
      padding-top: 27px;
      border-top: 1px solid var(--border);
    }

    .meta label {
      display: grid;
      gap: 9px;
      color: var(--muted);
      font-size: 13px;
    }

    .meta input,
    .meta select {
      width: 100%;
      min-width: 0;
      height: 43px;
      padding: 0 11px;
      border: 1px solid var(--border);
      border-radius: 10px;
      background: var(--surface);
      color: var(--text);
      font-size: 14px;
    }

    .meta input::placeholder {
      color: var(--placeholder);
    }

    .editor-bottom {
      flex: 0 0 auto;
      border-top: 1px solid var(--border);
      background: var(--surface);
    }

    .editor-actions {
      width: min(100%, 960px);
      min-height: 76px;
      margin: 0 auto;
      padding: 12px clamp(22px, 5vw, 56px);
    }

    .editor-actions .left {
      display: flex;
      gap: 8px;
    }

    .toast {
      position: fixed;
      z-index: 100;
      left: 50%;
      bottom: 22px;
      transform: translateX(-50%);
      max-width: calc(100vw - 28px);
      padding: 11px 17px;
      border-radius: 11px;
      background: #33343d;
      color: #fff;
      text-align: center;
      font-size: 14px;
      box-shadow: 0 8px 24px #0004;
      animation: toast-in .25s ease both;
    }

    .sidebar-backdrop {
      display: none;
    }

    @keyframes content-in {
      from {
        opacity: 0;
        transform: translateY(10px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @keyframes card-in {
      from {
        opacity: 0;
        transform: translateY(12px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @keyframes pop-in {
      from {
        opacity: 0;
        transform: translateY(-6px) scale(.97);
      }

      to {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }

    @keyframes editor-in {
      from {
        opacity: 0;
        transform: translateY(20px) scale(.985);
      }

      to {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }

    @keyframes editor-out {
      from {
        opacity: 1;
        transform: translateY(0) scale(1);
      }

      to {
        opacity: 0;
        transform: translateY(14px) scale(.985);
      }
    }

    @keyframes toast-in {
      from {
        opacity: 0;
        transform: translate(-50%, 8px);
      }

      to {
        opacity: 1;
        transform: translate(-50%, 0);
      }
    }

    @media (max-width: 700px) {
      .app {
        display: block;
      }

      .sidebar {
        position: fixed;
        z-index: 42;
        left: 0;
        width: min(82vw, 290px);
        transform: translateX(-100%);
        transition:
          transform .28s cubic-bezier(.2, .75, .2, 1),
          background-color .32s ease;
        box-shadow: 8px 0 28px #0002;
      }

      .sidebar.open {
        transform: translateX(0);
      }

      .sidebar-backdrop:not([hidden]) {
        position: fixed;
        z-index: 41;
        inset: 0;
        display: block;
        border: 0;
        background: #0008;
      }

      .main {
        padding: 18px 17px 65px;
      }

      .topbar {
        margin-bottom: 28px;
      }

      .mobile-brand,
      .mobile-only {
        display: block;
      }

      .mobile-brand {
        font-size: 19px;
      }

      .heading h1 {
        letter-spacing: -1.5px;
      }

      .grid {
        grid-template-columns: 1fr;
      }

      .card {
        min-height: 145px;
      }

      .editor-topbar {
        min-height: 65px;
        padding: 10px 16px;
      }

      .editor-app-name,
      .editor-status {
        display: none;
      }

      .editor-topbar-left,
      .editor-topbar-right {
        gap: 6px;
      }

      .editor-topbar-right .soft-btn {
        padding: 10px;
        font-size: 13px;
      }

      .editor-inner {
        padding: 35px 21px 60px;
      }

      .title-input {
        letter-spacing: -1px;
      }

      .text-input {
        min-height: 33vh;
        font-size: 16px;
      }

      .meta {
        grid-template-columns: 1fr;
      }

      .editor-actions {
        padding: 12px 16px;
      }

      .editor-actions .soft-btn {
        padding: 10px;
        font-size: 13px;
      }
    }

    @media (max-width: 430px) {
      #fullscreenButton {
        width: 40px;
        height: 40px;
        overflow: hidden;
        white-space: nowrap;
        font-size: 0;
      }

      #fullscreenButton::before {
        content: "⛶";
        font-size: 19px;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *,
      *::before,
      *::after {
        animation-duration: .01ms !important;
        transition-duration: .01ms !important;
        scroll-behavior: auto !important;
      }
    }
  </style>
</head>

<body>
  <div class="app">
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-header">
        <div class="brand">Заметки<span>.</span></div>

        <button
          class="icon-btn theme-toggle"
          type="button"
          title="Переключить тему"
          aria-label="Переключить тему"
        >☾</button>
      </div>

      <nav>
        <div class="side-label">Библиотека</div>

        <button class="nav-item active" data-view="all">
          ▦ &nbsp; Все заметки
          <span class="count" id="allCount">0</span>
        </button>

        <button class="nav-item" data-view="pinned">
          ☆ &nbsp; Закреплённые
          <span class="count" id="pinnedCount">0</span>
        </button>
      </nav>

      <div>
        <div class="side-label">Папки</div>
        <div id="folderNav"></div>

        <button class="nav-item" id="addFolder">
          ＋ &nbsp; Новая папка
        </button>
      </div>

      <div class="side-bottom">
        <button class="nav-item" id="shareSide">
          ↗ &nbsp; Поделиться списком
        </button>
      </div>
    </aside>

    <button
      class="sidebar-backdrop"
      id="sidebarBackdrop"
      hidden
      aria-label="Закрыть меню"
    ></button>

    <main class="main">
      <div class="topbar">
        <div class="top-actions">
          <button
            class="icon-btn mobile-only"
            id="mobileMenu"
            aria-label="Открыть меню"
          >☰</button>

          <!-- На компьютере кнопка расположена слева вверху страницы. -->
          <button
            class="icon-btn theme-toggle"
            type="button"
            title="Переключить тему"
            aria-label="Переключить тему"
          >☾</button>

          <span class="mobile-brand">
            Заметки<span>.</span>
          </span>
        </div>

        <div class="top-actions">
          <div class="popover-wrap">
            <button
              class="icon-btn"
              id="menuButton"
              aria-label="Меню"
              aria-expanded="false"
            >⋯</button>

              </button>

  <section

  >
    <header class="editor-topbar">

          <div class="popover-wrap">
            <button
              class="attach-plus"

            <div class="popover attach-menu" id="attachMenu" hidden>

            style="margin-top: 9px"
          >
            ＋ Добавить пункт
          </button>

        <div id="attachmentsSection" hidden>
          <div class="section-label">Вложения</div>
          <div class="attachments" id="attachments"></div>

        <div class="meta">
          <label>
            Папка
            <select id="noteFolder"></select>

          <label>
            Теги через запятую
            <input id="noteTags" placeholder="идеи, работа">

    <footer class="editor-bottom">
      <div class="editor-actions">

  <input
    type="file"
    id="imageInput"
    accept="image/*"
    multiple
    hidden
  >

  <input type="file" id="fileInput" multiple hidden>

  <input
    type="file"
    id="importInput"
    accept=".json,application/json"
    hidden
  >

  <div class="toast" id="toast" hidden></div>

  <script>
    "use strict";

    const $ = selector => document.querySelector(selector);

    // Название базы прежнее: существующие заметки не теряются.
    const DB_NAME = "beautiful-notes-db";
    const MAX_FILE_BYTES = 5 * 1024 * 1024;

    let db;
    let notes = [];
    let folders = ["Личные", "Работа", "Идеи"];
    let currentView = "all";
    let draft = null;
    let toastTimer;
    let closeTimer;

    function uid() {
      return crypto.randomUUID
        ? crypto.randomUUID()
        : Date.now() + "-" + Math.random().toString(36).slice(2);
    }

    function escapeHTML(value) {
      return String(value ?? "").replace(/[&<>"']/g, char => ({
        "&": "&amp;",
        "<": "&lt;",
        ">": "&gt;",
        '"': "&quot;",
        "'": "&#39;"
      })[char]);
    }

    function applyTheme(theme) {
      const dark = theme === "dark";

      document.documentElement.dataset.theme =
        dark ? "dark" : "light";

      $("#themeColor").content =
        dark ? "#111218" : "#f5f5f7";

      document.querySelectorAll(".theme-toggle").forEach(button => {
        button.textContent = dark ? "☀" : "☾";
        button.title = dark
          ? "Включить светлую тему"
          : "Включить тёмную тему";

        button.setAttribute("aria-label", button.title);
      });

      try {
        localStorage.setItem(
          "notes-theme",
          dark ? "dark" : "light"
        );
      } catch {
        // Интерфейс продолжит работать без localStorage.
      }
    }

    function notify(message) {
      const element = $("#toast");

      element.textContent = message;
      element.hidden = false;

      clearTimeout(toastTimer);

      toastTimer = setTimeout(() => {
        element.hidden = true;
      }, 3500);
    }

    function openDB() {
      return new Promise((resolve, reject) => {
        const request = indexedDB.open(DB_NAME, 1);

        request.onupgradeneeded = () => {
          const database = request.result;

          database.createObjectStore("notes", {
            keyPath: "id"
          });

          database.createObjectStore("settings", {
            keyPath: "key"
          });
        };

        request.onsuccess = () => resolve(request.result);
        request.onerror = () => reject(request.error);
      });
    }

    function transaction(store, mode, operation) {
      return new Promise((resolve, reject) => {
        const tx = db.transaction(store, mode);
        const result = operation(tx.objectStore(store));

        let value;

        result.onsuccess = () => {
          value = result.result;
        };

        tx.oncomplete = () => resolve(value);
        tx.onerror = () => reject(tx.error);
        tx.onabort = () => reject(tx.error);
      });
    }

    const getAllNotes = () =>
      transaction("notes", "readonly", store => store.getAll());

    const putNote = note =>
      transaction("notes", "readwrite", store => store.put(note));

    const removeNote = id =>
      transaction("notes", "readwrite", store => store.delete(id));

    const getFolders = () =>
      transaction("settings", "readonly", store => store.get("folders"));

    const saveFolders = () =>
      transaction(
        "settings",
        "readwrite",
        store => store.put({
          key: "folders",
          value: folders
        })
      );

    function formatDate(timestamp) {
      return new Intl.DateTimeFormat("ru", {
        day: "numeric",
        month: "short",
        year: "numeric"
      }).format(timestamp);
    }

    function closeSidebar() {
      $("#sidebar").classList.remove("open");
      $("#sidebarBackdrop").hidden = true;
    }

    function renderNav() {
      $("#allCount").textContent = notes.length;

      $("#pinnedCount").textContent =
        notes.filter(note => note.pinned).length;

      document
        .querySelectorAll(".nav-item[data-view]")
        .forEach(button => {
          button.classList.toggle(
            "active",
            button.dataset.view === currentView
          );
        });

      $("#folderNav").innerHTML = folders.map(folder => {
        const count =
          notes.filter(note => note.folder === folder).length;

        return `
          <button
            class="nav-item ${
              currentView === "folder:" + folder ? "active" : ""
            }"
            data-folder="${escapeHTML(folder)}"
          >
            ▤ &nbsp; ${escapeHTML(folder)}
            <span class="count">${count}</span>
          </button>
        `;
      }).join("");
    }

    function visibleNotes() {
      const query = $("#search")
        .value
        .trim()
        .toLocaleLowerCase("ru");

      return notes.filter(note => {
        if (currentView === "pinned" && !note.pinned) {
          return false;
        }

        if (
          currentView.startsWith("folder:") &&
          note.folder !== currentView.slice(7)
        ) {
          return false;
        }

        const text = [
          note.title,
          note.text,
          note.folder,
          ...(note.tags || []),
          ...(note.checks || []).map(item => item.text)
        ].join(" ").toLocaleLowerCase("ru");

        return text.includes(query);
      }).sort((a, b) =>
        Number(Boolean(b.pinned)) -
          Number(Boolean(a.pinned)) ||
        (b.updatedAt || 0) -
          (a.updatedAt || 0)
      );
    }

    function render() {
      renderNav();

      const heading =
        currentView === "all"
          ? "Все заметки"
          : currentView === "pinned"
            ? "Закреплённые"
            : currentView.slice(7);

      $("#pageTitle").textContent = heading;

      const shown = visibleNotes();

      $("#pageSubtitle").textContent =
        `${shown.length} ${
          shown.length === 1 ? "заметка" : "заметок"
        } · Ваши мысли — в одном месте.`;

      $("#notesGrid").innerHTML = shown.length
        ? shown.map((note, index) => {
            const preview =
              note.text?.trim() ||
              (
                note.checks?.length
                  ? `☑ Список дел · ${note.checks.length} пунктов`
                  : ""
              ) ||
              (
                note.attachments?.length
                  ? "▧ Вложения"
                  : "Пустая заметка"
              );

            const tags = (note.tags || [])
              .slice(0, 2)
              .map(tag =>
                `<span class="badge">#${escapeHTML(tag)}</span>`
              )
              .join("");

            return `
              <button
                class="card"
                data-id="${escapeHTML(note.id)}"
                style="animation-delay: ${Math.min(index, 8) * 35}ms"
              >
                <div class="card-title">
                  <span>
                    ${escapeHTML(note.title || "Без названия")}
                  </span>

                  <span style="color: #d5aa26">
                    ${note.pinned ? "★" : ""}
                  </span>
                </div>

                <div class="card-preview">
                  ${escapeHTML(preview)}
                </div>

                <div class="card-footer">
                  <span>
                    ${formatDate(note.updatedAt || Date.now())}
                  </span>

                  ${
                    note.folder
                      ? `<span>· ${escapeHTML(note.folder)}</span>`
                      : ""
                  }

                  ${note.reminder ? "<span>· ♧</span>" : ""}

                  ${
                    note.attachments?.length
                      ? `<span>· ▧ ${note.attachments.length}</span>`
                      : ""
                  }

                  ${tags}
                </div>
              </button>
            `;
          }).join("")
        : `
          <div class="empty">
            <strong>Пока здесь пусто</strong>
            Создайте заметку или попробуйте другой запрос.
          </div>
        `;
    }

    function renderFolderOptions() {
      $("#noteFolder").innerHTML =
        `<option value="">Без папки</option>` +
        folders.map(folder => `
          <option value="${escapeHTML(folder)}">
            ${escapeHTML(folder)}
          </option>
        `).join("");
    }

    function addCheckRow(
      item = {
        id: uid(),
        text: "",
        done: false
      }
    ) {
      const row = document.createElement("div");

      row.className = "check-row";
      row.dataset.id = item.id;

      const checkbox = document.createElement("input");

      checkbox.type = "checkbox";
      checkbox.checked = Boolean(item.done);
      checkbox.setAttribute("aria-label", "Пункт выполнен");

      const input = document.createElement("input");

      input.type = "text";
      input.placeholder = "Новый пункт";
      input.value = item.text || "";

      const remove = document.createElement("button");

      remove.className = "soft-btn";
      remove.type = "button";
      remove.textContent = "×";
      remove.title = "Удалить пункт";

      remove.onclick = () => {
        row.remove();

        $("#checksSection").hidden =
          !$("#checks").children.length;
      };

      row.append(checkbox, input, remove);

      $("#checks").append(row);
      $("#checksSection").hidden = false;

      return input;
    }

    function safeLink(url) {
      try {
        const parsed = new URL(url);

        return ["https:", "http:"].includes(parsed.protocol)
          ? parsed.href
          : null;
      } catch {
        return null;
      }
    }

    function renderAttachments() {
      const container = $("#attachments");

      container.replaceChildren();

      $("#attachmentsSection").hidden =
        !draft.attachments.length;

      draft.attachments.forEach((attachment, index) => {
        const box = document.createElement("div");

        box.className = "attachment";

        if (attachment.kind === "image") {
          const image = document.createElement("img");

          image.src = attachment.data;
          image.alt = attachment.name;

          box.append(image);
        } else {
          const link = document.createElement("a");

          const target =
            attachment.kind === "link"
              ? safeLink(attachment.url)
              : attachment.data;

          link.href = target || "#";
          link.textContent =
            (attachment.kind === "link" ? "↗ " : "▤ ") +
            attachment.name;

          link.title = attachment.name;

          if (attachment.kind === "link") {
            link.target = "_blank";
            link.rel = "noopener noreferrer";
          } else {
            link.download = attachment.name;
          }

          box.append(link);
        }

        const remove = document.createElement("button");

        remove.className = "remove-attachment";
        remove.type = "button";
        remove.textContent = "×";
        remove.title = "Удалить вложение";

        remove.onclick = () => {
          draft.attachments.splice(index, 1);
          renderAttachments();
        };

        box.append(remove);
        container.append(box);
      });
    }

    function updatePinButton() {
      $("#pinNote").textContent =
        draft.pinned ? "★ Закреплено" : "☆ Закрепить";
    }

    function openEditor(note = null) {
      clearTimeout(closeTimer);

      const editor = $("#editorScreen");

      editor.classList.remove("closing");

      draft = note
        ? structuredClone(note)
        : {
            id: uid(),
            title: "",
            text: "",
            folder: currentView.startsWith("folder:")
              ? currentView.slice(7)
              : "",
            tags: [],
            checks: [],
            attachments: [],
            pinned: false,
            reminder: "",
            notified: false,
            createdAt: Date.now()
          };

      draft.checks ||= [];
      draft.attachments ||= [];
      draft.tags ||= [];

      renderFolderOptions();

      $("#editorHeading").textContent =
        note ? "РЕДАКТИРОВАНИЕ ЗАМЕТКИ" : "НОВАЯ ЗАМЕТКА";

      $("#editorStatus").textContent =
        note ? "Редактирование" : "Новая заметка";

      $("#noteTitle").value = draft.title || "";
      $("#noteText").value = draft.text || "";
      $("#noteFolder").value = draft.folder || "";
      $("#noteTags").value = draft.tags.join(", ");
      $("#noteReminder").value = draft.reminder || "";
      $("#deleteNote").hidden = !note;

      $("#checks").replaceChildren();
      draft.checks.forEach(addCheckRow);

      $("#checksSection").hidden = !draft.checks.length;

      renderAttachments();
      updatePinButton();

      $("#attachMenu").hidden = true;

      editor.hidden = false;
      $("#editorContent").scrollTop = 0;

      document.body.style.overflow = "hidden";

      $("#noteTitle").focus();
    }

    async function closeEditor() {
      const editor = $("#editorScreen");

      if (editor.hidden || editor.classList.contains("closing")) {
        return;
      }

      if (document.fullscreenElement === editor) {
        try {
          await document.exitFullscreen();
        } catch (error) {
          console.error(error);
        }
      }

      editor.classList.add("closing");
      $("#attachMenu").hidden = true;

      const reduceMotion = window.matchMedia(
        "(prefers-reduced-motion: reduce)"
      ).matches;

      closeTimer = setTimeout(() => {
        editor.hidden = true;
        editor.classList.remove("closing");

        document.body.style.overflow = "";

        draft = null;
      }, reduceMotion ? 0 : 250);
    }

    async function toggleFullscreen() {
      const editor = $("#editorScreen");

      try {
        if (document.fullscreenElement === editor) {
          await document.exitFullscreen();
        } else if (editor.requestFullscreen) {
          await editor.requestFullscreen();
        } else {
          notify(
            "Браузер не поддерживает системный полноэкранный режим"
          );
        }
      } catch (error) {
        console.error(error);

        notify(
          "Браузер не разрешил скрыть свои панели. " +
          "Редактор всё равно открыт на весь экран страницы."
        );
      }
    }

    async function saveEditor() {
      if (!draft || $("#editorScreen").classList.contains("closing")) {
        return;
      }

      draft.title = $("#noteTitle").value.trim();
      draft.text = $("#noteText").value.trim();
      draft.folder = $("#noteFolder").value;

      draft.tags = [...new Set(
        $("#noteTags")
          .value
          .split(",")
          .map(tag => tag.trim())
          .filter(Boolean)
      )];

      draft.checks = [...$("#checks").children]
        .map(row => ({
          id: row.dataset.id,
          done:
            row.querySelector('[type="checkbox"]').checked,
          text:
            row.querySelector('[type="text"]').value.trim()
        }))
        .filter(item => item.text);

      const previousReminder = draft.reminder;

      draft.reminder = $("#noteReminder").value;

      if (draft.reminder !== previousReminder) {
        draft.notified = false;
      }

      draft.updatedAt = Date.now();

      try {
        await putNote(draft);

        notes = await getAllNotes();

        render();
        await closeEditor();

        notify("Заметка сохранена");
      } catch (error) {
        console.error(error);

        notify(
          "Не удалось сохранить. Возможно, закончилось место для вложений."
        );
      }
    }

    function readAsDataURL(file) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();

        reader.onload = () => resolve(reader.result);
        reader.onerror = () => reject(reader.error);

        reader.readAsDataURL(file);
      });
    }

    async function prepareImage(file) {
      const original = await readAsDataURL(file);

      try {
        const image = new Image();

        image.src = original;

        await image.decode();

        const scale = Math.min(
          1,
          1600 / Math.max(image.width, image.height)
        );

        const canvas = document.createElement("canvas");

        canvas.width = Math.max(
          1,
          Math.round(image.width * scale)
        );

        canvas.height = Math.max(
          1,
          Math.round(image.height * scale)
        );

        canvas
          .getContext("2d")
          .drawImage(
            image,
            0,
            0,
            canvas.width,
            canvas.height
          );

        return canvas.toDataURL("image/jpeg", .83);
      } catch {
        return original;
      }
    }

    async function handleFiles(files, imagesOnly) {
      if (!draft) {
        return;
      }

      for (const file of files) {
        if (file.size > MAX_FILE_BYTES) {
          notify(
            `Файл «${file.name}» больше 5 МБ и не добавлен`
          );

          continue;
        }

        if (
          imagesOnly &&
          !file.type.startsWith("image/")
        ) {
          continue;
        }

        try {
          const data = imagesOnly
            ? await prepareImage(file)
            : await readAsDataURL(file);

          draft.attachments.push({
            id: uid(),
            kind: imagesOnly ? "image" : "file",
            name: file.name,
            data
          });
        } catch {
          notify(
            `Не удалось прочитать файл «${file.name}»`
          );
        }
      }

      renderAttachments();
    }

    function shareText() {
      const items = visibleNotes();

      if (!items.length) {
        return "";
      }

      return items.map(note => {
        const checks = (note.checks || [])
          .map(item =>
            `${item.done ? "☑" : "☐"} ${item.text}`
          )
          .join("\n");

        const tags = (note.tags || [])
          .map(tag => "#" + tag)
          .join(" ");

        const reminder = note.reminder
          ? `Напомнить: ${
              note.reminder.replace("T", " ")
            }`
          : "";

        return [
          note.title || "Без названия",
          note.folder
            ? `Папка: ${note.folder}`
            : "",
          note.text,
          checks,
          tags,
          reminder
        ]
          .filter(Boolean)
          .join("\n");
      }).join("\n\n──────────\n\n");
    }

    async function shareNotes() {
      $("#mainMenu").hidden = true;

      const text = shareText();

      if (!text) {
        notify(
          "Нет заметок, которыми можно поделиться"
        );

        return;
      }

      if (navigator.share) {
        try {
          await navigator.share({
            title: "Мои заметки",
            text
          });

          return;
        } catch (error) {
          if (error.name === "AbortError") {
            return;
          }
        }
      }

      try {
        await navigator.clipboard.writeText(text);
        notify("Список заметок скопирован");
      } catch {
        const field =
          document.createElement("textarea");

        field.value = text;

        document.body.append(field);
        field.select();

        const copied =
          document.execCommand("copy");

        field.remove();

        notify(
          copied
            ? "Список заметок скопирован"
            : "Не удалось скопировать список"
        );
      }
    }

    function downloadJSON() {
      const blob = new Blob(
        [
          JSON.stringify(
            {
              version: 1,
              folders,
              notes
            },
            null,
            2
          )
        ],
        {
          type: "application/json"
        }
      );

      const url = URL.createObjectURL(blob);
      const link = document.createElement("a");

      link.href = url;
      link.download = "zametki-backup.json";
      link.click();

      setTimeout(() => {
        URL.revokeObjectURL(url);
      }, 1000);

      $("#mainMenu").hidden = true;
    }

    async function importJSON(file) {
      try {
        const data = JSON.parse(
          await file.text()
        );

        if (
          !Array.isArray(data.notes) ||
          !Array.isArray(data.folders)
        ) {
          throw new Error("Неверный формат");
        }

        const incomingNotes =
          data.notes.filter(note =>
            note &&
            typeof note.id === "string" &&
            typeof note.title === "string"
          );

        const confirmed = confirm(
          `Импортировать ${
            incomingNotes.length
          } заметок? Заметки с одинаковым ID будут заменены.`
        );

        if (!confirmed) {
          return;
        }

        folders = [
          ...new Set([
            ...folders,
            ...data.folders.filter(folder =>
              typeof folder === "string" &&
              folder.trim()
            )
          ])
        ];

        await saveFolders();

        for (const note of incomingNotes) {
          await putNote(note);
        }

        notes = await getAllNotes();

        render();

        notify(
          `Импортировано: ${incomingNotes.length}`
        );
      } catch (error) {
        console.error(error);
        notify("Не удалось импортировать файл");
      }
    }

    async function checkReminders() {
      const now = Date.now();

      const due = notes.filter(note =>
        note.reminder &&
        !note.notified &&
        new Date(note.reminder).getTime() <= now
      );

      for (const note of due) {
        note.notified = true;

        try {
          await putNote(note);
        } catch (error) {
          console.error(error);
        }

        notify(
          `Напоминание: ${
            note.title || "Без названия"
          }`
        );

        if (
          "Notification" in window &&
          Notification.permission === "granted"
        ) {
          new Notification(
            note.title || "Напоминание",
            {
              body:
                note.text?.slice(0, 120) ||
                "Пора заглянуть в заметку"
            }
          );
        }
      }
    }

    function toggleMenu(button, menu) {
      const willOpen = menu.hidden;

      $("#mainMenu").hidden = true;
      $("#attachMenu").hidden = true;

      menu.hidden = !willOpen;

      button.setAttribute(
        "aria-expanded",
        String(willOpen)
      );
    }

    async function init() {
      applyTheme(
        document.documentElement.dataset.theme
      );

      document.querySelectorAll(".theme-toggle").forEach(button => {
        button.onclick = () => {
          const nextTheme =
            document.documentElement.dataset.theme === "dark"
              ? "light"
              : "dark";

          applyTheme(nextTheme);
        };
      });

      try {
        db = await openDB();
        notes = await getAllNotes();

        const saved = await getFolders();

        if (
          saved?.value &&
          Array.isArray(saved.value)
        ) {
          folders = saved.value;
        }
      } catch (error) {
        console.error(error);

        notify(
          "Хранилище недоступно. Проверьте настройки браузера."
        );

        $("#newNote").disabled = true;

        return;
      }

      render();
      checkReminders();

      setInterval(checkReminders, 30000);

      $("#newNote").onclick = () =>
        openEditor();

      $("#search").oninput = render;

      $("#notesGrid").onclick = event => {
        const card =
          event.target.closest("[data-id]");

        if (!card) {
          return;
        }

        const note = notes.find(item =>
          item.id === card.dataset.id
        );

        if (note) {
          openEditor(note);
        }
      };

      document
        .querySelectorAll(".nav-item[data-view]")
        .forEach(button => {
          button.onclick = () => {
            currentView = button.dataset.view;

            closeSidebar();
            render();
          };
        });

      $("#folderNav").onclick = event => {
        const button =
          event.target.closest("[data-folder]");

        if (!button) {
          return;
        }

        currentView =
          "folder:" + button.dataset.folder;

        closeSidebar();
        render();
      };

      $("#addFolder").onclick = async () => {
        const name =
          prompt("Название новой папки:")
            ?.trim();

        if (!name) {
          return;
        }

        const exists = folders.some(folder =>
          folder.toLocaleLowerCase("ru") ===
          name.toLocaleLowerCase("ru")
        );

        if (exists) {
          notify("Такая папка уже существует");
          return;
        }

        folders.push(name);

        await saveFolders();

        render();
      };

      $("#mobileMenu").onclick = () => {
        $("#sidebar").classList.add("open");
        $("#sidebarBackdrop").hidden = false;
      };

      $("#sidebarBackdrop").onclick =
        closeSidebar;

      $("#menuButton").onclick = () =>
        toggleMenu(
          $("#menuButton"),
          $("#mainMenu")
        );

      $("#attachButton").onclick = () =>
        toggleMenu(
          $("#attachButton"),
          $("#attachMenu")
        );

      $("#shareSide").onclick = () => {
        closeSidebar();
        shareNotes();
      };

      $("#shareMenu").onclick =
        shareNotes;

      $("#exportButton").onclick =
        downloadJSON;

      $("#importButton").onclick = () => {
        $("#mainMenu").hidden = true;
        $("#importInput").click();
      };

      $("#importInput").onchange =
        async event => {
          if (event.target.files[0]) {
            await importJSON(
              event.target.files[0]
            );
          }

          event.target.value = "";
        };

      $("#closeEditor").onclick =
        closeEditor;

      $("#fullscreenButton").onclick =
        toggleFullscreen;

      document.addEventListener(
        "fullscreenchange",
        () => {
          const active =
            document.fullscreenElement ===
            $("#editorScreen");

          $("#fullscreenButton").textContent =
            active
              ? "⛶ Обычный режим"
              : "⛶ На весь экран";
        }
      );

      $("#saveNote").onclick =
        saveEditor;

      $("#deleteNote").onclick =
        async () => {
          if (
            !draft ||
            !confirm(
              "Удалить эту заметку?"
            )
          ) {
            return;
          }

          try {
            await removeNote(draft.id);

            notes = await getAllNotes();

            render();
            await closeEditor();

            notify("Заметка удалена");
          } catch {
            notify(
              "Не удалось удалить заметку"
            );
          }
        };

      $("#pinNote").onclick = () => {
        draft.pinned = !draft.pinned;
        updatePinButton();
      };

      $("#addCheck").onclick = () => {
        $("#attachMenu").hidden = true;
        addCheckRow().focus();
      };

      $("#addAnotherCheck").onclick =
        () => addCheckRow().focus();

      $("#addImage").onclick = () => {
        $("#attachMenu").hidden = true;
        $("#imageInput").click();
      };

      $("#addFile").onclick = () => {
        $("#attachMenu").hidden = true;
        $("#fileInput").click();
      };

      $("#imageInput").onchange =
        async event => {
          await handleFiles(
            [...event.target.files],
            true
          );

          event.target.value = "";
        };

      $("#fileInput").onchange =
        async event => {
          await handleFiles(
            [...event.target.files],
            false
          );

          event.target.value = "";
        };

      $("#addLink").onclick = () => {
        $("#attachMenu").hidden = true;

        let url = prompt(
          "Вставьте ссылку:"
        );

        if (!url) {
          return;
        }

        url = url.trim();

        if (
          !/^[a-z]+:\/\//i.test(url)
        ) {
          url = "https://" + url;
        }

        const valid =
          safeLink(url);

        if (!valid) {
          notify(
            "Нужна ссылка вида https://example.com"
          );

          return;
        }

        const name =
          prompt(
            "Название ссылки:",
            valid
          ) || valid;

        draft.attachments.push({
          id: uid(),
          kind: "link",
          name,
          url: valid
        });

        renderAttachments();
      };

      document.addEventListener(
        "click",
        event => {
          if (
            !event.target.closest(
              "#menuButton, #mainMenu"
            )
          ) {
            $("#mainMenu").hidden = true;

            $("#menuButton")
              .setAttribute(
                "aria-expanded",
                "false"
              );
          }

          if (
            !event.target.closest(
              "#attachButton, #attachMenu"
            )
          ) {
            $("#attachMenu").hidden = true;

            $("#attachButton")
              .setAttribute(
                "aria-expanded",
                "false"
              );
          }
        }
      );

      document.addEventListener(
        "keydown",
        event => {
          if (event.key === "Escape") {
            $("#mainMenu").hidden = true;
            $("#attachMenu").hidden = true;

            closeSidebar();

            if (
              !$("#editorScreen").hidden &&
              !document.fullscreenElement
            ) {
              closeEditor();
            }
          }

          if (
            (event.ctrlKey || event.metaKey) &&
            event.key.toLowerCase() === "s" &&
            !$("#editorScreen").hidden
          ) {
            event.preventDefault();
            saveEditor();
          }
        }
      );
    }

    init();
  </script>
</body>
</html>
